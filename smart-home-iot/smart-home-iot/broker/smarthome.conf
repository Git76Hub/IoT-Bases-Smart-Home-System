# Dropped into /etc/mosquitto/conf.d/ by setup_broker.sh
# (the distro's main mosquitto.conf already handles persistence and logging)

listener 1883
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl

# Encrypted listener: run tools/gen_certs.sh, copy the files to
# /etc/mosquitto/certs/, then uncomment and restart mosquitto.
#listener 8883
#cafile /etc/mosquitto/certs/ca.crt
#certfile /etc/mosquitto/certs/server.crt
#keyfile /etc/mosquitto/certs/server.key
